# Publishes the website in site/ to GitHub Pages (free for public repos).
# The build adds the source-code zip the page links to, like netlify.toml does.
name: website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack the source code
        run: git archive --format=zip --prefix=Replay-0.1/ -o site/Replay-0.1-source.zip HEAD -- . ':!site' ':!.github' ':!netlify.toml'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
